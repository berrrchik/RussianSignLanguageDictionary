name: iOS CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Restore config files from secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RussianSignLanguageDictionary/Config
          require_secret() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "::error::Секрет $name не задан в GitHub Actions (нужен base64 файла)"
              exit 1
            fi
          }
          require_secret "GOOGLE_SERVICE_INFO_PLIST" "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}"
          require_secret "API_CONFIG_SWIFT" "${{ secrets.API_CONFIG_SWIFT }}"
          require_secret "FIREBASE_CONFIG_SWIFT" "${{ secrets.FIREBASE_CONFIG_SWIFT }}"
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -D > RussianSignLanguageDictionary/Config/GoogleService-Info.plist
          echo "${{ secrets.API_CONFIG_SWIFT }}" | base64 -D > RussianSignLanguageDictionary/Config/APIConfig.swift
          echo "${{ secrets.FIREBASE_CONFIG_SWIFT }}" | base64 -D > RussianSignLanguageDictionary/Config/FirebaseConfig.swift
          test -s RussianSignLanguageDictionary/Config/GoogleService-Info.plist || { echo "::error::GoogleService-Info.plist пуст после base64"; exit 1; }
          test -s RussianSignLanguageDictionary/Config/APIConfig.swift || { echo "::error::APIConfig.swift пуст после base64 — проверьте секрет API_CONFIG_SWIFT"; exit 1; }
          test -s RussianSignLanguageDictionary/Config/FirebaseConfig.swift || { echo "::error::FirebaseConfig.swift пуст после base64"; exit 1; }
          if ! grep -q '<plist' RussianSignLanguageDictionary/Config/GoogleService-Info.plist; then
            echo "::error::После base64 plist не похож на XML. В секрет кладите вывод: base64 -i GoogleService-Info.plist | tr -d '\n'"
            exit 1
          fi
          if ! grep -q 'enum APIConfig' RussianSignLanguageDictionary/Config/APIConfig.swift; then
            echo "::error::APIConfig.swift битый после decode. В секрет только base64 файла: base64 -i APIConfig.swift | tr -d '\n' (не исходный Swift, не двойной base64)."
            exit 1
          fi
          if ! grep -q 'enum FirebaseConfig' RussianSignLanguageDictionary/Config/FirebaseConfig.swift; then
            echo "::error::FirebaseConfig.swift битый после decode (часто в секрет попал исходник вместо base64 или лишний символ в конце). Обновите FIREBASE_CONFIG_SWIFT: base64 -i FirebaseConfig.swift | tr -d '\n'"
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run tests
        timeout-minutes: 30
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
        run: bundle exec fastlane tests_ci

  deploy_testflight:
    name: Deploy TestFlight
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Restore config files from secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RussianSignLanguageDictionary/Config
          require_secret() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "::error::Секрет $name не задан в GitHub Actions (нужен base64 файла)"
              exit 1
            fi
          }
          require_secret "GOOGLE_SERVICE_INFO_PLIST" "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}"
          require_secret "API_CONFIG_SWIFT" "${{ secrets.API_CONFIG_SWIFT }}"
          require_secret "FIREBASE_CONFIG_SWIFT" "${{ secrets.FIREBASE_CONFIG_SWIFT }}"
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -D > RussianSignLanguageDictionary/Config/GoogleService-Info.plist
          echo "${{ secrets.API_CONFIG_SWIFT }}" | base64 -D > RussianSignLanguageDictionary/Config/APIConfig.swift
          echo "${{ secrets.FIREBASE_CONFIG_SWIFT }}" | base64 -D > RussianSignLanguageDictionary/Config/FirebaseConfig.swift
          test -s RussianSignLanguageDictionary/Config/GoogleService-Info.plist || { echo "::error::GoogleService-Info.plist пуст после base64"; exit 1; }
          test -s RussianSignLanguageDictionary/Config/APIConfig.swift || { echo "::error::APIConfig.swift пуст после base64"; exit 1; }
          test -s RussianSignLanguageDictionary/Config/FirebaseConfig.swift || { echo "::error::FirebaseConfig.swift пуст после base64"; exit 1; }
          if ! grep -q '<plist' RussianSignLanguageDictionary/Config/GoogleService-Info.plist; then
            echo "::error::После base64 plist не похож на XML. В секрет кладите вывод: base64 -i GoogleService-Info.plist | tr -d '\n'"
            exit 1
          fi
          if ! grep -q 'enum APIConfig' RussianSignLanguageDictionary/Config/APIConfig.swift; then
            echo "::error::APIConfig.swift битый после decode. В секрет только base64 файла: base64 -i APIConfig.swift | tr -d '\n' (не исходный Swift, не двойной base64)."
            exit 1
          fi
          if ! grep -q 'enum FirebaseConfig' RussianSignLanguageDictionary/Config/FirebaseConfig.swift; then
            echo "::error::FirebaseConfig.swift битый после decode (часто в секрет попал исходник вместо base64 или лишний символ в конце). Обновите FIREBASE_CONFIG_SWIFT: base64 -i FirebaseConfig.swift | tr -d '\n'"
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Deploy to TestFlight via Fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane beta
